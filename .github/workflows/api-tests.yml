name: API Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install
      - run: npm run test:api